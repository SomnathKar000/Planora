# ────────────────────────────────────────────────────────────────
# Planora — Docker Compose (Development)
# ────────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d        # Start PostgreSQL
#   docker compose down         # Stop and remove containers
#   docker compose down -v      # Stop and wipe data volumes
# ────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: planora-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: planora
      POSTGRES_PASSWORD: planora
      POSTGRES_DB: planora
    volumes:
      - planora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planora -d planora"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  planora_pgdata:
    driver: local
